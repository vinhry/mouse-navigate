name: Build

# Every push and pull request is built and tested with the same toolchain the release
# workflow uses, so a compiler difference turns up here rather than after tagging.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
